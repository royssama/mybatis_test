spring:
  application:
    name: mybatis-test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:mybatis-test;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
